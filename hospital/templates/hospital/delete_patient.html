{% extends 'hospital/base.html' %}

{% block title %}Confirm Delete - MediCare{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="form-section" style="max-width:480px;margin:2rem auto;text-align:center;">
    <div class="mb-3" style="font-size:3rem;color:var(--danger);">
        <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h2 class="mb-2">Confirm Deletion</h2>
    <p class="text-muted mb-4">Are you sure you want to delete this record? This action cannot be undone.</p>
    <form method="POST">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash me-1"></i> Yes, Delete
            </button>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
